limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

upstream autoprime_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers (defense-in-depth alongside the Next.js app-level headers in
    # next.config.mjs — kept in sync manually since Nginx does not read that file).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Only meaningful once TLS is terminated somewhere in front of this proxy (see README).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /_next/static/ {
        proxy_pass http://autoprime_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        alias /app/public/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Extra throttle in front of the admin login endpoint, on top of the app's own
    # in-memory rate limiter (src/lib/rate-limit.ts) — this one survives app restarts.
    location = /api/admin/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://autoprime_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://autoprime_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
