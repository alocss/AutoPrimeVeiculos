name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoprime
          POSTGRES_PASSWORD: autoprime
          POSTGRES_DB: autoprime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoprime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # This Postgres only exists inside the ephemeral job container above and is never
      # reachable outside this run, so a fixed CI-only credential here carries no real risk —
      # but ADMIN_SESSION_SECRET / ADMIN_PASSWORD_HASH still read from GitHub Secrets when
      # configured, falling back to a clearly-labeled throwaway value so the workflow also
      # runs on forks/PRs that don't have repo secrets.
      DATABASE_URL: postgresql://autoprime:autoprime@localhost:5432/autoprime?schema=public
      ADMIN_SESSION_SECRET: ${{ secrets.CI_ADMIN_SESSION_SECRET || 'ci-only-secret-never-used-outside-this-ephemeral-job' }}
      ADMIN_EMAIL: admin@autoprimeveiculos.com.br
      ADMIN_PASSWORD_HASH: ${{ secrets.CI_ADMIN_PASSWORD_HASH || 'd0974ef0758bfe66dcdd0d4416ecd86b:e35f92edf2b57e3cbf99f019b98c4d8f6d1e2fb272b48b42e07743fae6d394a0df11e7f298276d9c077f3845a10d6ba8770ebf331acaa5daa35822149b252d8e' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: "5511999999999"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-check
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: autoprime-veiculos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
